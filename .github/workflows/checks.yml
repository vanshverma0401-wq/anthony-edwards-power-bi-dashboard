name: Public portfolio checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned workbook-audit dependency
        run: python -m pip install -r requirements.txt
      - name: Run synthetic and aggregate-only tests
        run: python -m unittest discover -s tests -v
      - name: Verify deterministic review image
        run: |
          python scripts/render_review.py technical/data_validation.json --output assets/review/season-scoring-overview.svg
          git diff --exit-code -- assets/review/season-scoring-overview.svg
